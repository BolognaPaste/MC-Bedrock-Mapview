[package]
name = "bedrock-map"
version = "0.5.0"
description = "Turns a Minecraft Bedrock world into a pan-and-zoom web map"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps overworld/nether/end in the order they were written (the pages use the first one as the default)
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
regex = "1"
# draws map tiles on all CPU cores
rayon = "1"
# the live link's small HTTP server that companion plugins push to
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Map drawing is heavy; keep dependencies optimised even in debug builds.
[profile.dev.package."*"]
opt-level = 3
